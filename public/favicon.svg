<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Consulta de Carros">
  <!-- Fundo proprio: a aba do navegador pode ser clara ou escura, e um icone
       sem fundo some numa das duas. Mesma cor da barra do painel. -->
  <rect width="32" height="32" rx="7" fill="#1a1a2e"/>

  <!-- CARRO — a forma principal, ocupando a largura toda. A primeira versao
       deste icone tinha a lupa grande no meio e o carro sumia atras dela: a
       16px sobrava so um anel verde. Aqui o carro manda e a lupa e o acento.
       A cabine e bem mais clara que o corpo de proposito — com tons proximos,
       a 16px os dois viram um borrao so. -->
  <path d="M10.6 18.5 12.9 14c.3-.6.9-.9 1.5-.9h4.2c.6 0 1.1.3 1.4.8l2.6 4.6z" fill="#c5cae9"/>
  <rect x="3.6" y="17.6" width="24.8" height="5.6" rx="2.2" fill="#7986cb"/>
  <!-- rodas: aro escuro para destacar do corpo, miolo claro -->
  <circle cx="9.8" cy="23.2" r="3.2" fill="#1a1a2e"/>
  <circle cx="9.8" cy="23.2" r="1.7" fill="#c5cae9"/>
  <circle cx="22.4" cy="23.2" r="3.2" fill="#1a1a2e"/>
  <circle cx="22.4" cy="23.2" r="1.7" fill="#c5cae9"/>

  <!-- LUPA — canto superior direito, cabo apontando para FORA do carro.
       O anel leva um contorno escuro (o traco largo por baixo) para nao se
       fundir com a cabine onde os dois se encostam.
       O CABO E DESENHADO POR ULTIMO, e nao antes do anel: na versao anterior
       ele vinha primeiro, o contorno escuro do anel cobria a emenda e o cabo
       aparecia solto, como uma virgula verde ao lado da lente. -->
  <circle cx="21.3" cy="8.1" r="5.6" fill="none" stroke="#1a1a2e" stroke-width="4"/>
  <circle cx="21.3" cy="8.1" r="4.6" fill="#0e0e14" fill-opacity=".5" stroke="#66bb6a" stroke-width="2.8"/>
  <line x1="24.3" y1="11.1" x2="27.7" y2="14.5" stroke="#66bb6a" stroke-width="3.2" stroke-linecap="round"/>
</svg>
